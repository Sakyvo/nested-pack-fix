buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'forge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.1.1'
    }
}

apply plugin: 'forge'

version = '1.0.0'
group = 'com.sakyvo.nestedpackfix'
archivesBaseName = 'NestedPackFix-1.7.10'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
    mappings = 'stable_12'
}

runClient {
    jvmArgs '-Dfml.coreMods.load=com.sakyvo.nestedpackfix.forge1710.NestedPackFixLoadingPlugin'
}

repositories {
    mavenCentral()
}

dependencies {
    testCompile 'junit:junit:4.13.2'
}

sourceSets {
    main {
        java.srcDir file('../common/src/main/java')
    }
    test {
        java.srcDir file('../common/src/test/java')
    }
}

processResources {
    inputs.property 'version', project.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand version: project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'com.sakyvo.nestedpackfix.forge1710.NestedPackFixLoadingPlugin',
            'FMLCorePluginContainsFMLMod': 'true',
            'ModSide': 'CLIENT'
        )
    }
}

task verifyReleaseJar(dependsOn: reobf) {
    doLast {
        def releaseJar = file("$buildDir/libs/${archivesBaseName}-${version}.jar")
        if (!releaseJar.isFile()) {
            throw new GradleException("Release JAR not found: $releaseJar")
        }

        def jarFile = new java.util.jar.JarFile(releaseJar)
        try {
            def attributes = jarFile.manifest.mainAttributes
            def requiredManifest = [
                FMLCorePlugin: 'com.sakyvo.nestedpackfix.forge1710.NestedPackFixLoadingPlugin',
                FMLCorePluginContainsFMLMod: 'true',
                ModSide: 'CLIENT'
            ]
            requiredManifest.each { key, value ->
                if (attributes.getValue(key) != value) {
                    throw new GradleException("Invalid manifest $key")
                }
            }

            def requiredEntries = [
                'mcmod.info',
                'com/sakyvo/nestedpackfix/archive/ArchiveInspector.class',
                'com/sakyvo/nestedpackfix/forge1710/NestedPackFixLoadingPlugin.class',
                'com/sakyvo/nestedpackfix/forge1710/NestedPackFixMod.class',
                'com/sakyvo/nestedpackfix/forge1710/core/NestedPackFixTransformer.class',
                'com/sakyvo/nestedpackfix/forge1710/pack/CompatiblePackFactory.class',
                'com/sakyvo/nestedpackfix/forge1710/client/ResourcePackGuiHandler.class',
                'com/sakyvo/nestedpackfix/forge1710/client/NestedResourcePackEntry.class',
                'com/sakyvo/nestedpackfix/forge1710/client/IllegalResourcePackEntry.class'
            ]
            requiredEntries.each { entry ->
                if (jarFile.getEntry(entry) == null) {
                    throw new GradleException("Missing release entry: $entry")
                }
            }

            def metadata = new groovy.json.JsonSlurper().parseText(
                jarFile.getInputStream(jarFile.getEntry('mcmod.info')).getText('UTF-8')
            )[0]
            if (metadata.modid != 'nestedpackfix'
                || metadata.name != 'NestedPackFix'
                || metadata.version != version.toString()
                || metadata.mcversion != '1.7.10') {
                throw new GradleException('Invalid mcmod.info identity')
            }

            def forbiddenPrefixes = [
                'org/objectweb/asm/',
                'org/apache/commons/',
                'com/google/common/',
                'org/apache/logging/log4j/',
                'org/spongepowered/',
                'gg/essential/'
            ]
            jarFile.entries().toList().each { entry ->
                if (forbiddenPrefixes.any { entry.name.startsWith(it) }) {
                    throw new GradleException("Embedded runtime dependency: ${entry.name}")
                }
                if (entry.name.endsWith('.class')) {
                    byte[] header = new byte[8]
                    def stream = new DataInputStream(jarFile.getInputStream(entry))
                    try {
                        stream.readFully(header)
                    } finally {
                        stream.close()
                    }
                    int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                    if (major != 52) {
                        throw new GradleException(
                            "Non-Java-8 class ${entry.name}: major $major"
                        )
                    }
                }
            }
        } finally {
            jarFile.close()
        }
    }
}

build.dependsOn verifyReleaseJar
